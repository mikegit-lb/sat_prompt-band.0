<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Grammar Prompt Lab</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#172033;--muted:#68738a;--brand:#5746d8;--line:#e6e9f2;--shadow:0 12px 35px #25345d12}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f8fc,#eef0ff);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}header{padding:56px 22px 40px;text-align:center;background:radial-gradient(circle at 50% 0,#dcd6ff,transparent 60%)}h1{font-size:clamp(2.2rem,5vw,4.5rem);line-height:1.02;margin:12px auto;letter-spacing:-.06em;max-width:850px}header p{max-width:760px;margin:18px auto;color:var(--muted);font-size:1.08rem}.wrap{max-width:1240px;margin:auto;padding:20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0 28px}.search{flex:1;min-width:240px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:1rem;outline:none}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 15px;cursor:pointer}.filter.active,.filter:hover{background:var(--brand);border-color:var(--brand);color:#fff}.count{color:var(--muted);font-size:.92rem;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:390px}.number{color:var(--brand);font-weight:800;font-size:.82rem;letter-spacing:.08em}.card h2{font-size:1.15rem;margin:10px 0 8px}.card p{color:var(--muted);line-height:1.55;margin:0 0 14px;flex:1}.details{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-size:.88rem;line-height:1.5}.details strong{color:var(--ink)}.tag{display:inline-block;width:max-content;background:#f0eeff;color:#5544c9;border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:700;margin-bottom:15px}.copy{border:0;background:var(--ink);color:#fff;padding:11px 14px;border-radius:10px;cursor:pointer;font-weight:700;margin-top:15px}.copy:hover{background:var(--brand)}footer{text-align:center;padding:45px;color:var(--muted);font-size:.9rem}@media(max-width:600px){header{padding-top:35px}.toolbar{align-items:stretch}.count{margin-left:0;width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="tag">SAT DIGITAL • GRAMMAR PRACTICE</div><h1>50 targeted prompts to sharpen your grammar score.</h1><p>Each prompt now specifies the passage context, tested skill, difficulty, required answer format, distractor design, explanation, and SAT-style constraints.</p></header>
<main class="wrap"><div class="toolbar"><input class="search" id="search" placeholder="Search prompts, topics, or skills…" aria-label="Search prompts"><div class="filters" id="filters"></div><span class="count" id="count"></span></div><section class="grid" id="grid"></section></main><footer>Prompt Lab · Built for deliberate SAT practice</footer>
<script>
const prompts=[
['Punctuation','Comma between independent clauses','Write one original SAT-style Editing question in a 2–3 sentence passage about a scientific discovery. Test whether a comma is needed between two independent clauses. Provide one underlined portion, four choices labeled A–D, one correct answer, and a concise explanation identifying the subject and verb of each clause. Make three distractors reflect a comma splice, a semicolon error, and an unnecessary conjunction. Difficulty: medium.'],
['Punctuation','Semicolons','Create a difficult SAT question using a passage about an architectural innovation. Test a semicolon joining two closely related independent clauses. Ensure both sides can stand alone and do not include a coordinating conjunction. Give choices A–D, mark the answer, explain the rule, and state why each distractor is wrong.'],
['Punctuation','Colons','Create an SAT-style question in a passage about an ecology study. Test a colon introducing a logically complete list or explanation. Include four punctuation choices, only one correct. Require the explanation to verify that the words before the colon form a complete sentence and that the material after it clarifies or illustrates the first clause.'],
['Punctuation','Introductory phrases','Write a medium-difficulty question about a 5–7 word introductory phrase in a passage about a historical expedition. Ask whether a comma belongs after the phrase. Include four choices that vary comma placement and no comma. Explain how the comma separates introductory context from the main clause.'],
['Punctuation','Restrictive vs. nonrestrictive modifiers','Create an SAT question about a museum exhibit. The sentence must contain a relative clause beginning with which or that. Test whether the information is essential to identify the noun. Provide four punctuation choices and explain why restrictive information uses no commas while nonrestrictive information does.'],
['Punctuation','Possessive apostrophes','Write an SAT-style question about a university researcher’s notes. Test singular possessive, plural possessive, or a possessive ending in s. Include four answer choices with realistic apostrophe errors. Give the correct answer and explain ownership, number, and placement of the apostrophe.'],
['Punctuation','Nonessential appositives','Create a question in a passage about a famous inventor. Include an appositive that renames a noun but is not necessary to identify it. Ask for the correct punctuation. Include comma, dash, and no-punctuation distractors, then explain the removal test.'],
['Punctuation','Comma splices','Write a question about two independent clauses in a passage on public transportation. The tested location must currently contain a comma splice. Offer four revisions using a period, semicolon, conjunction, or incorrect comma. Explain why only the correctly bounded revision works.'],
['Punctuation','Transitions','Create a question in a passage about two competing climate models. Test punctuation around a transition such as however or therefore. Include choices with a semicolon, comma, and period in different positions. Explain both the transition rule and the sentence-boundary rule.'],
['Punctuation','Compound sentences','Write an SAT-style question about two independent clauses joined by and, but, or so in a passage about a community project. Test whether the comma belongs before the conjunction. Make the clauses substantial enough to be independent and explain every choice.'],
['Boundaries','Choosing a sentence boundary','Create a question in a passage about a historical reform. At the tested point, two independent clauses must be joined. Provide four options: period, semicolon, comma plus coordinating conjunction, and comma alone. Require the explanation to identify clause independence. Difficulty: medium.'],
['Boundaries','Dependent and independent clauses','Write an SAT question about a research method beginning with a dependent clause such as although or because. Test comma placement between the dependent and independent clauses. Include four choices and explain the difference between a dependent clause and a complete sentence.'],
['Boundaries','Sentence fragments','Create a question in a passage about an artist’s technique where one answer creates a fragment beginning with a subordinating word. Ask for the choice that produces a complete sentence. Explain the missing independent clause and why the other choices fail.'],
['Boundaries','Combining short sentences','Write an SAT-style question about two short sentences describing an engineering prototype. Ask students to choose the most effective combination. Require grammatical completeness, logical connection, and concision. Include one comma splice, one fragment, one awkward repetition, and one correct answer.'],
['Boundaries','Run-on sentences','Create a difficult question in a passage about voting rights where three independent clauses have been incorrectly fused. Ask for the best revision at one underlined location. Include four choices and explain sentence boundaries without changing the historical meaning.'],
['Boundaries','Claim and evidence','Write an SAT question about a scientist’s claim followed by supporting evidence. Test the boundary between the claim and evidence. Provide choices using a colon, semicolon, comma, and period. Explain which punctuation reflects the logical relationship and grammatical structure.'],
['Boundaries','Conjunctive adverbs','Create a question in a passage about technological change using nevertheless, consequently, or similarly. Test the punctuation required when the word connects independent clauses. Include four alternatives and explain that a conjunctive adverb cannot replace a coordinating conjunction.'],
['Boundaries','Relative-clause attachment','Write an SAT-style question about a conservation program. Include a relative clause that could attach logically to either of two nearby nouns. Ask for the clearest grammatically correct revision. Explain modifier placement and avoid ambiguity.'],
['Boundaries','Complete sentence diagnosis','Create a question with four plausible boundary choices in a passage about a literary movement. Only one option should result in a complete, correctly punctuated sentence. Require students to distinguish an independent clause, dependent clause, fragment, and run-on.'],
['Boundaries','Flow without comma splices','Write an editing question about a paragraph on renewable energy. Ask for the best way to connect two related ideas while maintaining smooth flow. Include a period, semicolon, coordinating conjunction, and comma splice as choices. Explain meaning and grammar.'],
['Form & Structure','Subject–verb agreement with interruption','Create a question in a passage about a wildlife survey. Place a prepositional phrase between the subject and verb, such as “The collection of samples...” Test singular/plural agreement. Include four verb choices and explain that the head noun controls agreement.'],
['Form & Structure','Indefinite pronouns','Write an SAT-style item about a school policy using each, everyone, neither, or several. Test subject–verb agreement and pronoun reference. Provide four choices, one correct, and explain whether the indefinite pronoun is singular or plural.'],
['Form & Structure','Verb tense across time','Create a question in a passage about an invention developed in the nineteenth century and studied today. Test the correct tense at one underlined verb. Supply a timeline in the surrounding sentences and explain why the answer preserves chronological logic.'],
['Form & Structure','Active and passive voice','Write an SAT question about a laboratory procedure. Ask for the clearest revision of a passive sentence when the actor matters. Include four choices; one should use active voice, one should be unnecessarily passive, one should create a fragment, and one should change the meaning.'],
['Form & Structure','Pronoun–antecedent agreement','Create a question in a passage about two researchers and their findings. Test whether a pronoun clearly agrees with its antecedent in number and meaning. Include four choices and explain agreement and ambiguity.'],
['Form & Structure','Pronoun case','Write an SAT-style question about a debate team. Test subject/object pronoun case using forms such as I/me, he/him, or they/them. Require students to remove the surrounding noun to identify the correct form. Explain the grammatical role.'],
['Form & Structure','Dangling modifiers','Create a question in a passage about analyzing tree rings. Begin with an introductory participial phrase, then provide four revisions. Only one must make the grammatical subject the logical actor. Explain the dangling-modifier problem clearly.'],
['Form & Structure','Parallel structure','Write a question about the benefits of volunteering. Include a series containing three verbs or noun phrases. Test whether all elements use matching grammatical forms. Provide four choices with subtle parallelism errors and explain the pattern.'],
['Form & Structure','Logical comparisons','Create an SAT item in a passage comparing two novels, two experiments, or two policies. Test whether the comparison is logically between equivalent things. Include a faulty comparison involving a person versus a quality and explain the correction.'],
['Form & Structure','Modifier placement','Write a question about a spacecraft using only, nearly, or just. Place the modifier so that its position changes the intended meaning. Ask for the clearest choice and explain exactly what the modifier limits.'],
['Concision & Style','Concise expression','Create an SAT-style question in a passage about a medical breakthrough. Present four ways to express the same idea. The correct answer must be the most concise without losing a necessary detail. Explain redundancy, grammar, and meaning.'],
['Concision & Style','Redundancy','Write an editing question about a city-planning report. Include a phrase such as “future plans,” “advance planning,” or “completely finished.” Ask students to remove the redundant word or phrase while preserving the intended meaning.'],
['Concision & Style','Precise word choice','Create a question about scientific research where several words are grammatically possible but only one precisely matches the evidence. Include four choices and explain connotation, specificity, and context rather than merely defining the words.'],
['Concision & Style','Specific verbs','Write an SAT item about an inventor presenting a prototype. Replace a vague verb such as made, did, or went with the most precise context-appropriate verb. Include four choices and explain why the correct verb conveys the exact action.'],
['Concision & Style','Formal academic tone','Create a question in a passage about literary criticism. Test whether the wording maintains a formal, objective academic tone. Include one informal idiom, one exaggerated phrase, one grammatically incorrect choice, and one precise formal answer.'],
['Concision & Style','Removing unnecessary phrases','Write an SAT question about a historical speech. Include an unnecessary phrase such as “due to the fact that” or “in the process of.” Ask for the most concise revision and explain why it does not alter the meaning.'],
['Concision & Style','Consistent diction','Create a question in a paragraph about an invention that mixes overly casual and formal diction. Ask for the choice that maintains a consistent academic register. Explain audience, tone, and context.'],
['Concision & Style','Transition selection','Write an SAT-style question with two sentences about a proposed environmental solution and an unexpected limitation. Test the transition showing contrast. Include however, moreover, therefore, and similarly as choices, with explanation.'],
['Concision & Style','Avoiding informality','Create an editing question in a passage about a literary movement. Test replacement of an informal phrase such as “a lot of” or “kids” with precise academic language. Ensure the correct answer is concise and context-appropriate.'],
['Concision & Style','Pronoun clarity','Write a question about a university study containing an ambiguous “it,” “this,” or “they.” Ask for the revision that names the exact noun. Explain how the correct answer improves clarity without adding unnecessary words.'],
['Organization','Contrast transition','Create a question in a passage comparing two research findings. Ask which transition best signals contrast. Provide four choices with different logical relationships and explain why only one fits the preceding and following sentences.'],
['Organization','Paragraph introduction','Write an SAT-style question asking which sentence best introduces a paragraph about a city’s environmental project. Provide four options: broad but relevant, too specific, unrelated, and an effective overview. Explain paragraph purpose.'],
['Organization','Add/delete/retain','Create an SAT question about a paragraph on an archaeological discovery. Ask whether a particular sentence should be added, deleted, or retained. Require the explanation to connect the sentence to the paragraph’s main purpose and evidence.'],
['Organization','Sentence placement','Write a question asking where a sentence about a historical figure’s motivation should be placed in a four-sentence paragraph. Label insertion points [A], [B], [C], and [D]. Explain the logical sequence and transition clues.'],
['Organization','Process order','Create an SAT item explaining how a scientific instrument is calibrated. Ask students to place one sentence in the most logical position. Include chronological or procedural cues and explain why the other positions disrupt the sequence.'],
['Organization','Best supporting evidence','Write a question about a claim concerning urban green spaces. Provide four possible evidence sentences. Only one should directly support the claim; the others should be related but insufficient. Explain relevance and strength of support.'],
['Organization','Cause-and-effect transition','Create an SAT-style question in a history passage describing a policy change and its consequence. Test a transition such as consequently, nevertheless, for example, or meanwhile. Explain the exact logical relationship.'],
['Organization','Paragraph focus','Write an editing question about a paragraph whose main focus is a new farming technique. Include one irrelevant sentence about an unrelated invention. Ask whether it should be deleted and explain why it does not support the paragraph’s purpose.'],
['Organization','Effective conclusion','Create a question asking which concluding sentence best follows a passage about a community-led restoration project. Include four options: unsupported new claim, repeated detail, overly broad statement, and a conclusion that synthesizes the passage.'],
['Organization','Overall cohesion','Write a final SAT-style editing prompt using a 5–6 sentence passage about a scientific or cultural topic. Ask students to improve overall cohesion. Require one transition or sentence-order decision, four choices, a correct answer, and a detailed explanation of paragraph logic.']
];
const grid=document.querySelector('#grid'),filters=document.querySelector('#filters'),search=document.querySelector('#search'),count=document.querySelector('#count');let active='All';
['All',...new Set(prompts.map(x=>x[0]))].forEach(x=>{const b=document.createElement('button');b.className='filter'+(x==='All'?' active':'');b.textContent=x;b.onclick=()=>{active=x;document.querySelectorAll('.filter').forEach(y=>y.classList.remove('active'));b.classList.add('active');render()};filters.append(b)});
function render(){const q=search.value.toLowerCase();const shown=prompts.map((x,i)=>({x,i})).filter(o=>(active==='All'||o.x[0]===active)&&o.x.join(' ').toLowerCase().includes(q));count.textContent=`${shown.length} of ${prompts.length} prompts`;grid.innerHTML=shown.map(({x,i})=>`<article class="card"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="tag">${x[0]}</span><h2>${x[1]}</h2><p>${x[2]}</p><div class="details"><strong>Prompt target:</strong> Generate one SAT-style item with four choices, one defensible answer, and a rule-based explanation. Preserve the requested context and difficulty.</div><button class="copy" data-i="${i}">Copy enhanced prompt</button></article>`).join('');document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(prompts[b.dataset.i][2]);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy enhanced prompt',1200)})}search.oninput=render;render();
</script>
</body></html>
